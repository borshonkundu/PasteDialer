plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.pastedtmf'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.pastedtmf"
        minSdk 21            // Android 5.0 Lollipop
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Intentionally NO dependencies: no AppCompat, no Material, no Kotlin stdlib.
dependencies { }
